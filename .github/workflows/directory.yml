name: directory

on:
  pull_request:
    paths:
      - 'plugins/foundry-connect/**'
      - 'plugins/foundry-connect-directory/**'
      - 'scripts/sync-directory.mjs'
      - '.github/workflows/directory.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/foundry-connect/**'
      - 'plugins/foundry-connect-directory/**'
      - 'scripts/sync-directory.mjs'
      - '.github/workflows/directory.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Directory copy matches foundry-connect
        run: node scripts/sync-directory.mjs --check
      - name: Directory copy declares no MCP server and no tool grants
        # the plugin directory refuses both from an organization that is not Verified
        run: |
          ! grep -rEn 'mcpServers|userConfig|\$\{' plugins/foundry-connect-directory/.claude-plugin
          ! grep -rEn '^allowed-tools:' plugins/foundry-connect-directory
          ! find plugins/foundry-connect-directory -name '.mcp.json' | grep .
